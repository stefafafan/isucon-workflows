name: tagpr

on:
  push:
    branches: ["main"]

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: Songmu/tagpr@35daec35e8e3172806c763d8f196e6434fd44fbd # v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

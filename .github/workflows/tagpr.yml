name: tagpr

on:
  push:
    branches: ["main"]

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: Songmu/tagpr@35daec35e8e3172806c763d8f196e6434fd44fbd # v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
